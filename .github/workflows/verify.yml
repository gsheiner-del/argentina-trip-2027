name: Verify Argentina trip app
on:
  push:
    branches:
      - feature/map-gmail-review
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test Gmail importer with synthetic fixtures
        run: node --test tests/*.test.cjs
      - name: Build
        run: npm run build
